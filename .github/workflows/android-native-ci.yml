# ─────────────────────────────────────────────────────────────────────────────
# CI — Android Native (LKVIP Mobile Native)
#
# Chạy khi:
#   • Push / PR lên main hoặc develop có thay đổi trong apps/mobile-native/**
#   • Kích hoạt thủ công (workflow_dispatch)
#
# Jobs:
#   1. lint-test  — Android Lint + Unit tests (JVM)
#   2. build-apk  — assembleDebug → upload artifact
#   3. distribute — Firebase App Distribution (chỉ develop branch)
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT     — JSON service account (dùng chung với Capacitor CI)
#   FIREBASE_APP_ID_NATIVE       — App ID native Android trên Firebase Console
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Android Native

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile-native/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile-native/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (debug | staging | release)'
        required: true
        default: 'debug'
      distribute:
        description: 'Upload to Firebase App Distribution?'
        required: true
        default: 'false'
        type: boolean

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

defaults:
  run:
    working-directory: apps/mobile-native

jobs:
  # ── 1. Lint + Unit tests ─────────────────────────────────────────────────────
  lint-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile-native/**/*.gradle*', 'apps/mobile-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: apps/mobile-native/app/build/reports/lint-results*.html
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: apps/mobile-native/app/build/reports/tests/
          retention-days: 7

  # ── 2. Build APK ─────────────────────────────────────────────────────────────
  build-apk:
    name: Build APK (${{ github.event.inputs.variant || 'debug' }})
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile-native/**/*.gradle*', 'apps/mobile-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── Debug / Staging build ─────────────────────────────────────────────────
      - name: Build Debug APK
        if: github.event.inputs.variant != 'release'
        run: ./gradlew assembleDebug

      # ── Release build (signed) ─────────────────────────────────────────────────
      - name: Decode keystore
        if: github.event.inputs.variant == 'release'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/lkvip-release.jks

      - name: Build Release AAB (signed)
        if: github.event.inputs.variant == 'release'
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/lkvip-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Debug APK artifact
        if: github.event.inputs.variant != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lkvip-native-debug-${{ github.sha }}
          path: apps/mobile-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB artifact
        if: github.event.inputs.variant == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lkvip-native-release-${{ github.sha }}
          path: apps/mobile-native/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── 3. Firebase App Distribution (develop branch only) ───────────────────────
  distribute:
    name: Firebase Distribute
    runs-on: ubuntu-latest
    needs: build-apk
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.distribute == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: lkvip-native-debug-${{ github.sha }}
          path: dist/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_NATIVE }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: native-testers,android-testers
          file: dist/app-debug.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message || 'Manual dispatch' }}
