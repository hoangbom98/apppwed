name: CI — Lint, Test & Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: source/backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint + Security Audit
  # ─────────────────────────────────────────────────────────────────────────
  lint-audit:
    name: Lint & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # --max-warnings 100 allows pre-existing warnings; new errors still fail
        # TODO: reduce to 0 once pre-existing violations are cleaned up
        run: npx eslint src --ext .js --max-warnings 100

      - name: Run npm security audit
        run: npm audit --audit-level=high
        # Chỉ fail nếu có lỗ hổng HIGH hoặc CRITICAL
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit Tests + Coverage
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: source/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_minimum_64_characters_long_xxxxxxxxxxx
          JWT_REFRESH_SECRET: ci_test_refresh_secret_minimum_64_characters_long_xxxxxxxx

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: source/backend/coverage/
          retention-days: 7
