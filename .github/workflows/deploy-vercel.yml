name: CD — Deploy Frontends to Vercel

# Deploys the 6 LKVIP SPA frontends to Vercel.
# Triggered when any frontend app or shared package changes on main.
#
# Required GitHub Secrets:
#   VERCEL_TOKEN              — Vercel personal access token
#   VERCEL_ORG_ID             — Vercel org / team ID
#   VERCEL_PROJECT_ID_HUB     — Vercel project ID for lkvip-hub
#   VERCEL_PROJECT_ID_GAME    — Vercel project ID for lkvip-game
#   VERCEL_PROJECT_ID_TRADING — Vercel project ID for lkvip-trading
#   VERCEL_PROJECT_ID_DATING  — Vercel project ID for lkvip-dating
#   VERCEL_PROJECT_ID_SPORTS  — Vercel project ID for lkvip-sports
#   VERCEL_PROJECT_ID_ADMIN   — Vercel project ID for lkvip-admin
#   VERCEL_PROJECT_ID_PORTAL  — Vercel project ID for lkvipgroup-portal
#   VERCEL_PROJECT_ID_BANKING — Vercel project ID for lkvip-banking
#   VERCEL_PROJECT_ID_INVEST  — Vercel project ID for lkvip-invest
#   VERCEL_PROJECT_ID_STORE   — Vercel project ID for lkvip-store
#   VERCEL_PROJECT_ID_ACADEMY — Vercel project ID for lkvip-academy
#
# Per-app VITE_* secrets (set in each Vercel project's dashboard instead):
#   VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, etc.

on:
  push:
    branches: [main]
    paths:
      - 'apps/hub/**'
      - 'apps/game/**'
      - 'apps/trading/**'
      - 'apps/dating/**'
      - 'apps/sports/**'
      - 'apps/admin-dashboard/**'
      - 'apps/lkvipgroup-portal/**'
      - 'apps/banking/**'
      - 'apps/invest/**'
      - 'apps/lkvip-store/**'
      - 'apps/academy/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

  # Allow manual deployment from GitHub UI
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (leave empty to deploy all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - hub
          - game
          - trading
          - dating
          - sports
          - admin-dashboard
          - portal
          - banking
          - invest
          - store
          - academy
      environment:
        description: 'Deploy target'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

# One deployment pipeline at a time; do not cancel in progress
concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Detect which apps changed ─────────────────────────────────────────────
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      hub:            ${{ steps.filter.outputs.hub }}
      game:           ${{ steps.filter.outputs.game }}
      trading:        ${{ steps.filter.outputs.trading }}
      dating:         ${{ steps.filter.outputs.dating }}
      sports:         ${{ steps.filter.outputs.sports }}
      admin:          ${{ steps.filter.outputs.admin }}
      portal:         ${{ steps.filter.outputs.portal }}
      banking:        ${{ steps.filter.outputs.banking }}
      invest:         ${{ steps.filter.outputs.invest }}
      store:          ${{ steps.filter.outputs.store }}
      academy:        ${{ steps.filter.outputs.academy }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hub:
              - 'apps/hub/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            game:
              - 'apps/game/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            trading:
              - 'apps/trading/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            dating:
              - 'apps/dating/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            sports:
              - 'apps/sports/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            admin:
              - 'apps/admin-dashboard/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            portal:
              - 'apps/lkvipgroup-portal/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            banking:
              - 'apps/banking/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            invest:
              - 'apps/invest/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            store:
              - 'apps/lkvip-store/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            academy:
              - 'apps/academy/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  # ── Reusable deploy job (one per app) ─────────────────────────────────────
  deploy-hub:
    name: Deploy Hub
    needs: changes
    if: |
      needs.changes.outputs.hub == 'true' ||
      github.event.inputs.app == 'hub' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Hub to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_HUB }}
          working-directory: ./apps/hub
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Hub deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://hub.tc-gaming.live/" -o /dev/null && echo "✓ Hub live"

  deploy-game:
    name: Deploy Game
    needs: changes
    if: |
      needs.changes.outputs.game == 'true' ||
      github.event.inputs.app == 'game' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Game to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_GAME }}
          working-directory: ./apps/game
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Game deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://game.tc-gaming.live/" -o /dev/null && echo "✓ Game live"

  deploy-trading:
    name: Deploy Trading
    needs: changes
    if: |
      needs.changes.outputs.trading == 'true' ||
      github.event.inputs.app == 'trading' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Trading to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_TRADING }}
          working-directory: ./apps/trading
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Trading deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://trade.tc-gaming.live/" -o /dev/null && echo "✓ Trading live"

  deploy-dating:
    name: Deploy Dating
    needs: changes
    if: |
      needs.changes.outputs.dating == 'true' ||
      github.event.inputs.app == 'dating' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Dating to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_DATING }}
          working-directory: ./apps/dating
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Dating deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://dating.tc-gaming.live/" -o /dev/null && echo "✓ Dating live"

  deploy-sports:
    name: Deploy Sports
    needs: changes
    if: |
      needs.changes.outputs.sports == 'true' ||
      github.event.inputs.app == 'sports' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Sports to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_SPORTS }}
          working-directory: ./apps/sports
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Sports deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://sports.tc-gaming.live/" -o /dev/null && echo "✓ Sports live"

  deploy-portal:
    name: Deploy LKVIP Group Portal
    needs: changes
    if: |
      needs.changes.outputs.portal == 'true' ||
      github.event.inputs.app == 'portal' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (npm — standalone portal)
        run: cd apps/lkvipgroup-portal && npm install
      - name: Deploy Portal to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
          working-directory: ./apps/lkvipgroup-portal
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Portal deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 15
          curl -fsSL --max-time 30 "https://lkvip.group/" -o /dev/null && echo "✓ Portal live"

  deploy-banking:
    name: Deploy Banking
    needs: changes
    if: |
      needs.changes.outputs.banking == 'true' ||
      github.event.inputs.app == 'banking' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Banking to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BANKING }}
          working-directory: ./apps/banking
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-invest:
    name: Deploy Invest (Next.js)
    needs: changes
    if: |
      needs.changes.outputs.invest == 'true' ||
      github.event.inputs.app == 'invest' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: Install dependencies (npm — Next.js standalone)
        run: cd apps/invest && npm install
      - name: Deploy Invest to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_INVEST }}
          working-directory: ./apps/invest
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-store:
    name: Deploy Store (Next.js)
    needs: changes
    if: |
      needs.changes.outputs.store == 'true' ||
      github.event.inputs.app == 'store' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: Install dependencies (npm — Next.js standalone)
        run: cd apps/lkvip-store && npm install
      - name: Deploy Store to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STORE }}
          working-directory: ./apps/lkvip-store
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-academy:
    name: Deploy Academy (Next.js)
    needs: changes
    if: |
      needs.changes.outputs.academy == 'true' ||
      github.event.inputs.app == 'academy' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: Install dependencies (npm — Next.js standalone)
        run: cd apps/academy && npm install
      - name: Deploy Academy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ACADEMY }}
          working-directory: ./apps/academy
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin:
    name: Deploy Admin Dashboard
    needs: changes
    if: |
      needs.changes.outputs.admin == 'true' ||
      github.event.inputs.app == 'admin-dashboard' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == '')
    runs-on: ubuntu-latest
    # Admin uses a stricter environment with extra protection
    environment: ${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants
      - name: Deploy Admin Dashboard to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: ./apps/admin-dashboard
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      - name: Verify Admin deployment
        if: github.event.inputs.environment == 'production'
        run: |
          sleep 10
          curl -fsSL --max-time 30 "https://admin.tc-gaming.live/" -o /dev/null && echo "✓ Admin live"

  # ── Notify on completion ────────────────────────────────────────────────────
  notify:
    name: Notify deployment result
    needs:
      - deploy-hub
      - deploy-game
      - deploy-trading
      - deploy-dating
      - deploy-sports
      - deploy-portal
      - deploy-banking
      - deploy-invest
      - deploy-store
      - deploy-academy
      - deploy-admin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          hub="${{ needs.deploy-hub.result }}"
          game="${{ needs.deploy-game.result }}"
          trading="${{ needs.deploy-trading.result }}"
          dating="${{ needs.deploy-dating.result }}"
          sports="${{ needs.deploy-sports.result }}"
          portal="${{ needs.deploy-portal.result }}"
          banking="${{ needs.deploy-banking.result }}"
          invest="${{ needs.deploy-invest.result }}"
          store="${{ needs.deploy-store.result }}"
          academy="${{ needs.deploy-academy.result }}"
          admin="${{ needs.deploy-admin.result }}"

          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              skipped)  echo "⏭️" ;;
              failure)  echo "❌" ;;
              *)        echo "⚠️" ;;
            esac
          }

          echo "## Vercel Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Hub           | $(status_icon $hub) $hub |" >> $GITHUB_STEP_SUMMARY
          echo "| Game          | $(status_icon $game) $game |" >> $GITHUB_STEP_SUMMARY
          echo "| Trading       | $(status_icon $trading) $trading |" >> $GITHUB_STEP_SUMMARY
          echo "| Dating        | $(status_icon $dating) $dating |" >> $GITHUB_STEP_SUMMARY
          echo "| Sports        | $(status_icon $sports) $sports |" >> $GITHUB_STEP_SUMMARY
          echo "| Portal        | $(status_icon $portal) $portal |" >> $GITHUB_STEP_SUMMARY
          echo "| Banking       | $(status_icon $banking) $banking |" >> $GITHUB_STEP_SUMMARY
          echo "| Invest        | $(status_icon $invest) $invest |" >> $GITHUB_STEP_SUMMARY
          echo "| Store         | $(status_icon $store) $store |" >> $GITHUB_STEP_SUMMARY
          echo "| Academy       | $(status_icon $academy) $academy |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin         | $(status_icon $admin) $admin |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
