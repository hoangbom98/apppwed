name: Deploy to Production VPS

on:
  push:
    branches: [main]

# Prevent concurrent deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Verify CI passes first ─────────────────────────────────────────────────
  pre-deploy-check:
    name: Pre-Deploy Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend (deploy gate)
        run: pnpm --filter group-backend run lint

      - name: TypeCheck backend (deploy gate)
        run: pnpm --filter group-backend run type-check

      - name: Run tests (deploy gate)
        run: pnpm --filter group-backend run test
        env:
          NODE_ENV: test

  # ── Deploy to VPS ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 600s
          script: |
            set -euo pipefail
            echo "=== KJC Deploy triggered by GitHub Actions ==="
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor:  ${{ github.actor }}"

            cd /var/www/website-admin
            bash source/scripts/deploy.sh --module all

            echo "=== Deploy completed successfully ==="

      - name: Notify deploy success
        if: success()
        run: |
          echo "✅ Deploy to production succeeded"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"

      - name: Notify deploy failure
        if: failure()
        run: |
          echo "❌ Deploy to production FAILED"
          echo "Commit: ${{ github.sha }}"
          echo "Check VPS logs: pm2 logs api-server --lines 100"
