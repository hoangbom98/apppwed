name: CD — Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'source/code/backend/**'
      - 'source/code/frontend/**'
      - 'source/code/packages/**'
      - 'source/code/shared-types/**'
      - 'source/code/package.json'
      - 'source/code/pnpm-workspace.yaml'

  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # Guard: manual trigger must type "deploy"
  guard:
    name: Deployment guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    steps:
      - run: echo "Deployment approved ✓"

  # Run CI checks first
  ci:
    name: Run CI checks
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Deploy to VPS via SSH
  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/LKVIP

            echo "=== [1/5] Git pull ==="
            git pull origin main

            echo "=== [2/5] Install dependencies ==="
            cd source/code
            pnpm install --frozen-lockfile --prod=false

            echo "=== [3/5] Build backend ==="
            cd backend
            pnpm build
            cd ..

            echo "=== [4/5] Build frontends ==="
            pnpm run build:frontends

            echo "=== [5/5] Reload PM2 (zero-downtime) ==="
            cd backend
            pm2 reload lkvip-api --update-env
            pm2 save

            echo "=== Deploy complete ==="
            pm2 status

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sleep 5
            STATUS=$(curl -sf http://localhost:5000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "error")
            if [ "$STATUS" != "healthy" ]; then
              echo "ERROR: Health check failed! Status: $STATUS"
              exit 1
            fi
            echo "Health check passed: $STATUS ✓"
