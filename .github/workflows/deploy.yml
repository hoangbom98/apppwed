# ═══════════════════════════════════════════════════════════════════════
# GitHub Actions — KJC Platform CI/CD
#
# Triggers:
#   push  → main  : full build + SSH deploy to production VPS
#   push  → dev   : build only (smoke test), no deploy
#   PR    → main  : build + lint check
#
# Secrets required (set in repo Settings → Secrets → Actions):
#   VPS_HOST       — IP or hostname of the Ubuntu VPS
#   VPS_USER       — SSH username (e.g. ubuntu or deploy)
#   VPS_SSH_KEY    — private key (PEM) for SSH authentication
#   VPS_DEPLOY_DIR — absolute path on VPS (e.g. /var/www/website-admin)
# ═══════════════════════════════════════════════════════════════════════

name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. BUILD & LINT
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build CLI tool
        working-directory: source
        run: pnpm run cli:build

      - name: Build all frontends
        working-directory: source
        run: pnpm run build:frontends

      - name: Lint backend
        working-directory: source
        run: pnpm run lint:backend

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            source/frontend/hub/dist
            source/frontend/game/dist
            source/frontend/trade/dist
            source/frontend/dating/dist
            source/frontend/sports/dist
            source/frontend/admin-dashboard/dist
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # 2. DEPLOY TO PRODUCTION VPS  (main branch only)
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: source

      # Run deploy.sh on the VPS via SSH
      # deploy.sh does: git pull → pnpm ci → prisma migrate deploy → build → pm2 reload
      - name: SSH — Rolling deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          timeout:  300s
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_DIR }}

            echo "=== [1/5] Git pull ==="
            git pull origin main

            echo "=== [2/5] Install deps ==="
            cd source
            pnpm install --frozen-lockfile

            echo "=== [3/5] Prisma migrate (all DBs) ==="
            cd backend
            npm run prisma:deploy:all
            cd ..

            echo "=== [4/5] Build frontends ==="
            pnpm run build:frontends

            echo "=== [5/5] PM2 zero-downtime reload ==="
            cd backend
            pm2 reload api-server --update-env

            echo "=== Deploy complete ==="
            pm2 status

      - name: Notify deploy status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy to production succeeded (commit: ${{ github.sha }})"
          else
            echo "❌ Deploy failed — check logs above"
          fi
