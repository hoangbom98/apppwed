# ─────────────────────────────────────────────────────────────────────────────
# Firebase App Distribution — iOS (LKVIP Group)
#
# Build IPA (Ad Hoc) và phân phối đến nhóm tester iOS mỗi khi:
#   • Push lên nhánh `develop` có thay đổi trong app tương ứng
#   • Kích hoạt thủ công qua workflow_dispatch
#
# QUAN TRỌNG — iOS cần thêm secrets ký code:
#   FIREBASE_SERVICE_ACCOUNT        → JSON service account Firebase
#   FIREBASE_APP_ID_HUB_IOS         → App ID Firebase iOS (1:xxx:ios:yyy)
#   FIREBASE_APP_ID_GAME_IOS
#   FIREBASE_APP_ID_TRADE_IOS
#   FIREBASE_APP_ID_DATING_IOS
#   FIREBASE_APP_ID_SPORTS_IOS
#   IOS_P12_BASE64                  → base64(certificate.p12) — Ad Hoc cert
#   IOS_P12_PASSWORD                → Mật khẩu file .p12
#   IOS_PROVISIONING_PROFILE_BASE64 → base64(AdHoc.mobileprovision) — per app
#   IOS_KEYCHAIN_PASSWORD           → Mật khẩu keychain tạm (bất kỳ)
#
# Tham khảo cách tạo .p12 và provisioning profile:
#   https://developer.apple.com/help/account/manage-certificates/
# ─────────────────────────────────────────────────────────────────────────────

name: Firebase Distribute — iOS

on:
  push:
    branches: [develop]
    paths:
      - 'apps/hub/**'
      - 'apps/game/**'
      - 'apps/trading/**'
      - 'apps/dating/**'
      - 'apps/sports/**'
      - 'apps/mobile/**'
      - 'packages/**'

  workflow_dispatch:
    inputs:
      app:
        description: 'App cần phân phối (hub | game | trading | dating | sports | all)'
        required: true
        default: 'all'
      release_notes:
        description: 'Ghi chú phát hành'
        required: false
        default: 'Build thủ công từ GitHub Actions'

concurrency:
  group: firebase-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ── Reusable steps note ────────────────────────────────────────────────────────
# Mỗi job iOS đều có 3 giai đoạn:
#   1. Build web (Vite) → cap sync ios → xcodebuild archive → exportArchive (IPA)
#   2. Upload IPA lên Firebase App Distribution
#   3. Dọn dẹp keychain tạm
# macOS runner cần thiết vì Xcode chỉ chạy trên macOS.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Hub iOS ───────────────────────────────────────────────────────────────────
  distribute-hub:
    name: Hub — iOS
    runs-on: macos-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.app == 'hub' || github.event.inputs.app == 'all') ||
      github.event_name == 'push' &&
        contains(github.event.commits[0].modified, 'apps/hub/')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Build Hub SPA
        run: pnpm run build:hub
        env:
          VITE_API_URL: https://api.tc-gaming.live
          VITE_APP_ENV: staging

      - name: Capacitor sync (Hub → iOS)
        working-directory: apps/hub
        run: npx cap sync ios

      # ── Code signing ──────────────────────────────────────────────────────
      - name: Import code-signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile (Hub)
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_HUB_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/hub.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Build IPA ─────────────────────────────────────────────────────────
      - name: Build IPA (Hub Ad Hoc)
        working-directory: apps/hub/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/hub.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/hub.xcarchive \
            -exportOptionsPlist $GITHUB_WORKSPACE/config/firebase/ExportOptions-AdHoc.plist \
            -exportPath $RUNNER_TEMP/hub-ipa

      - name: Upload Hub IPA → Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_HUB_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: hub-testers,ios-testers
          file: ${{ runner.temp }}/hub-ipa/App.ipa
          releaseNotes: |
            ${{ github.event.inputs.release_notes || format('Auto build — branch: {0} — commit: {1}', github.ref_name, github.sha) }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

  # ── Game iOS ──────────────────────────────────────────────────────────────────
  distribute-game:
    name: Game — iOS
    runs-on: macos-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.app == 'game' || github.event.inputs.app == 'all') ||
      github.event_name == 'push' &&
        contains(github.event.commits[0].modified, 'apps/game/')

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - name: Build Game SPA
        run: pnpm run build:game
        env:
          VITE_API_URL: https://api.tc-gaming.live
          VITE_APP_ENV: staging

      - name: Capacitor sync (Game → iOS)
        working-directory: apps/game
        run: npx cap sync ios

      - name: Import code-signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile (Game)
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_GAME_BASE64 }}
        run: |
          echo -n "$PROFILE_BASE64" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/game.mobileprovision

      - name: Build IPA (Game Ad Hoc)
        working-directory: apps/game/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/game.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/game.xcarchive \
            -exportOptionsPlist $GITHUB_WORKSPACE/config/firebase/ExportOptions-AdHoc.plist \
            -exportPath $RUNNER_TEMP/game-ipa

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_GAME_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: game-testers,ios-testers
          file: ${{ runner.temp }}/game-ipa/App.ipa
          releaseNotes: |
            ${{ github.event.inputs.release_notes || format('Auto build — branch: {0} — commit: {1}', github.ref_name, github.sha) }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

  # ── Trading / Dating / Sports follow identical pattern ────────────────────────
  # Nhân bản job distribute-game ở trên, thay thế:
  #   - app:    game  → trading / dating / sports
  #   - secret: FIREBASE_APP_ID_GAME_IOS → FIREBASE_APP_ID_TRADE/DATING/SPORTS_IOS
  #   - secret: IOS_PROVISIONING_PROFILE_GAME_BASE64 → _TRADE / _DATING / _SPORTS
  #   - path filter: apps/game/ → apps/trading/ / apps/dating/ / apps/sports/
  #   - working-directory: apps/game → apps/trading / apps/dating / apps/sports
  #   - groups: game-testers → trade-testers / dating-testers / sports-testers
