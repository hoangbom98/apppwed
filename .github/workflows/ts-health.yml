name: "CI — TypeScript & Config Health Check"

# ── Trigger ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Chỉ một run cùng lúc trên mỗi PR — cancel run cũ nếu có push mới
concurrency:
  group: ts-check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Phát hiện vấn đề nhanh (fail fast)
  # ════════════════════════════════════════════════════════════════════════════
  ts-health-check:
    name: "TypeScript Health Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Check 1: pnpm.overrides phải tồn tại ──────────────────────────────
      - name: "Check pnpm.overrides exist in root package.json"
        run: |
          node -e "
            const p = require('./package.json');
            const overrides = p.pnpm?.overrides || {};
            const issues = [];
            if (!overrides.typescript)      issues.push('MISSING: pnpm.overrides.typescript');
            if (!overrides['@types/react'])  issues.push('MISSING: pnpm.overrides[@types/react]');
            if (!overrides['@types/react-dom']) issues.push('MISSING: pnpm.overrides[@types/react-dom]');
            if (issues.length > 0) {
              console.error('❌ pnpm.overrides không đầy đủ:');
              issues.forEach(i => console.error('  ' + i));
              console.error('  Fix: thêm vào root package.json:');
              console.error('  \"pnpm\": { \"overrides\": { \"typescript\": \"~6.0.2\", \"@types/react\": \"^18.3.0\", \"@types/react-dom\": \"^18.3.0\" } }');
              process.exit(1);
            }
            console.log('✅ pnpm.overrides:', JSON.stringify(overrides));
          "

      # ── Check 2: Không có local TS/React types conflict ────────────────────
      - name: "Check no TypeScript version conflicts"
        run: |
          ROOT_TS=$(node -e "console.log(require('./node_modules/typescript/package.json').version)")
          echo "Root TypeScript: $ROOT_TS"

          CONFLICT=false
          for dir in apps/*/; do
            app=$(basename "$dir")
            [[ "$app" == "external" || "$app" == "mobile"* || "$app" == "backend" ]] && continue
            [[ ! -f "$dir/package.json" ]] && continue

            local_ts=$(node -e "try{console.log(require('./${dir}node_modules/typescript/package.json').version)}catch(e){console.log('NONE')}" 2>/dev/null)
            local_react=$(node -e "try{console.log(require('./${dir}node_modules/@types/react/package.json').version)}catch(e){console.log('NONE')}" 2>/dev/null)

            if [[ "$local_ts" != "NONE" ]]; then
              echo "❌ $app có local TypeScript $local_ts (conflict với root $ROOT_TS)"
              CONFLICT=true
            fi
            if [[ "$local_react" != "NONE" ]]; then
              echo "⚠️  $app có local @types/react $local_react"
              # @types/react conflict là warning, không fail
            fi
          done

          if $CONFLICT; then
            echo ""
            echo "❌ TypeScript version conflict phát hiện!"
            echo "   Fix: thêm pnpm.overrides vào root package.json rồi chạy pnpm install"
            exit 1
          fi
          echo "✅ Không có TypeScript version conflict"

      # ── Check 3: tsconfig Next.js apps phải có required fields ────────────
      - name: "Check Next.js tsconfig compliance"
        run: |
          ERRORS=0
          for dir in apps/*/; do
            app=$(basename "$dir")
            # Detect Next.js app
            if [[ ! -f "${dir}next.config.ts" && ! -f "${dir}next.config.js" ]]; then
              continue
            fi
            tsconfig="${dir}tsconfig.json"
            if [[ ! -f "$tsconfig" ]]; then
              echo "❌ $app: tsconfig.json không tồn tại"
              ((ERRORS++))
              continue
            fi

            # Kiểm tra không extend Vite base
            extends_val=$(node -e "
              try {
                const raw=require('fs').readFileSync('$tsconfig','utf8')
                  .replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
                const d=JSON.parse(raw);
                console.log(d.extends || 'NONE');
              } catch(_){ console.log('ERROR'); }
            ")
            if [[ "$extends_val" == *"tsconfig.frontend.base"* ]]; then
              echo "❌ $app: tsconfig extends Vite base (không hợp lệ cho Next.js app)"
              ((ERRORS++))
            fi

            # Kiểm tra có plugins.next
            has_next_plugin=$(node -e "
              try {
                const raw=require('fs').readFileSync('$tsconfig','utf8')
                  .replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
                const d=JSON.parse(raw);
                const plugins=d.compilerOptions?.plugins||[];
                console.log(plugins.some(p=>p.name==='next')?'YES':'NO');
              } catch(_){ console.log('ERROR'); }
            ")
            if [[ "$has_next_plugin" != "YES" ]]; then
              echo "⚠️  $app: thiếu { \"name\": \"next\" } trong compilerOptions.plugins"
            fi

            echo "✅ $app tsconfig OK"
          done

          if [[ $ERRORS -gt 0 ]]; then
            echo "❌ $ERRORS tsconfig error(s) — chạy 'bash scripts/ts-fix.sh' để fix"
            exit 1
          fi

      # ── Check 4: ignoreDeprecations value hợp lệ ─────────────────────────
      - name: "Check ignoreDeprecations values"
        run: |
          ROOT_TS_MAJOR=$(node -e "console.log(require('./node_modules/typescript/package.json').version.split('.')[0])")
          echo "Active TypeScript major: $ROOT_TS_MAJOR"
          ERRORS=0

          for tsconfig in apps/*/tsconfig.json; do
            app=$(dirname "$tsconfig" | xargs basename)
            [[ "$app" == "backend" ]] && continue

            ign=$(node -e "
              try {
                const raw=require('fs').readFileSync('$tsconfig','utf8')
                  .replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
                const d=JSON.parse(raw);
                console.log(d.compilerOptions?.ignoreDeprecations||'NONE');
              } catch(_){ console.log('PARSE_ERROR'); }
            ")

            if [[ "$ign" != "NONE" && "$ign" != "PARSE_ERROR" ]]; then
              if [[ "$ROOT_TS_MAJOR" == "5" && "$ign" == "6.0" ]]; then
                echo "❌ $app: ignoreDeprecations='6.0' không valid với TS5"
                ((ERRORS++))
              elif [[ "$ROOT_TS_MAJOR" == "6" && "$ign" != "5.5" && "$ign" != "6.0" ]]; then
                echo "❌ $app: ignoreDeprecations='$ign' không valid với TS6 (cần '5.5' hoặc '6.0')"
                ((ERRORS++))
              fi
            fi
          done

          if [[ $ERRORS -gt 0 ]]; then
            echo "❌ ignoreDeprecations errors — chạy 'bash scripts/ts-fix.sh' để fix"
            exit 1
          fi
          echo "✅ ignoreDeprecations values OK"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: TypeScript typecheck cho từng app
  # ════════════════════════════════════════════════════════════════════════════
  typecheck-nextjs:
    name: "Typecheck Next.js apps"
    runs-on: ubuntu-latest
    needs: ts-health-check
    strategy:
      fail-fast: false   # Không cancel jobs khác khi 1 job fail
      matrix:
        app: [academy, invest, lkvip-store, lkvipgroup-portal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "TypeCheck ${{ matrix.app }}"
        run: |
          app="${{ matrix.app }}"
          echo "=== Typechecking $app ==="
          cd "apps/$app"

          # Kiểm tra tsc binary đang dùng
          tsc_version=$(npx tsc --version)
          echo "Using: $tsc_version"

          # Chạy typecheck
          if npx tsc --noEmit 2>&1 | tee /tmp/ts-output.txt; then
            echo "✅ $app typecheck passed"
          else
            errors=$(grep -c "error TS" /tmp/ts-output.txt || echo 0)
            echo "❌ $app: $errors TypeScript errors"
            cat /tmp/ts-output.txt
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3: Typecheck Vite apps (turbo)
  # ════════════════════════════════════════════════════════════════════════════
  typecheck-vite:
    name: "Typecheck Vite apps (Turbo)"
    runs-on: ubuntu-latest
    needs: ts-health-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@lkvip/types --filter=@lkvip/utils --filter=@lkvip/constants

      - name: Typecheck all Vite apps
        run: |
          pnpm turbo run typecheck \
            --filter=@lkvip/hub \
            --filter=@lkvip/game \
            --filter=@lkvip/trade \
            --filter=@lkvip/dating \
            --filter=@lkvip/sports \
            --filter=@lkvip/admin \
            --filter=@lkvip/banking \
            2>&1 | tee /tmp/turbo-typecheck.txt
          exit_code=${PIPESTATUS[0]}
          if [[ $exit_code -ne 0 ]]; then
            echo "❌ Vite apps typecheck failed"
            exit 1
          fi
          echo "✅ All Vite apps typecheck passed"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 4: Summary report — chạy sau tất cả
  # ════════════════════════════════════════════════════════════════════════════
  ts-summary:
    name: "TS Health Summary"
    runs-on: ubuntu-latest
    needs: [ts-health-check, typecheck-nextjs, typecheck-vite]
    if: always()  # Luôn chạy để có report dù có fail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JSON report
        run: bash scripts/ts-check.sh --json > /tmp/ts-report.json || true

      - name: Print summary to GitHub Step Summary
        run: |
          health="${{ needs.ts-health-check.result }}"
          nextjs="${{ needs.typecheck-nextjs.result }}"
          vite="${{ needs.typecheck-vite.result }}"

          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "⚠️" ;;
            esac
          }

          echo "## TypeScript Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check (overrides, conflicts, tsconfig) | $(icon $health) $health |" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck — Next.js apps | $(icon $nextjs) $nextjs |" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck — Vite apps    | $(icon $vite) $vite |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Version Snapshot" >> $GITHUB_STEP_SUMMARY
          root_ts=$(node -e "console.log(require('./node_modules/typescript/package.json').version)")
          root_react=$(node -e "console.log(require('./node_modules/@types/react/package.json').version)")
          echo "- TypeScript (root): \`$root_ts\`" >> $GITHUB_STEP_SUMMARY
          echo "- @types/react (root): \`$root_react\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
