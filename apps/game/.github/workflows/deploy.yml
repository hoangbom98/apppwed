# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — CI/CD cho Game Frontend
#
# Trigger: push lên nhánh main
#
# GITHUB SECRETS cần thiết (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     — IP server Ubuntu
#   DEPLOY_USER     — SSH user (ubuntu / root)
#   DEPLOY_SSH_KEY  — Nội dung private SSH key (-----BEGIN OPENSSH...)
#   DEPLOY_PATH     — Thư mục trên server (/var/www/game)
#   VITE_API_BASE_URL — URL backend API
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 CI/CD Game Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Build & Lint ──────────────────────────────────────────────────────────
  build:
    name: 📦 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/game/package-lock.json

      - name: Install dependencies
        working-directory: frontend/game
        run: npm ci --prefer-offline

      - name: Type check
        working-directory: frontend/game
        run: npx tsc --noEmit
        continue-on-error: true   # ← đặt false khi muốn chặn deploy nếu TS lỗi

      - name: Build production
        working-directory: frontend/game
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: frontend/game/dist/
          retention-days: 7

  # ── 2. Deploy (chỉ khi push vào main) ───────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/dist/"

      - name: Reload NGINX
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo nginx -t && sudo systemctl reload nginx"

      - name: 🎉 Deploy success
        run: echo "Game frontend deployed successfully to production!"
