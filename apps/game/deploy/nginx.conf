# ─────────────────────────────────────────────────────────────────────────────
# NGINX config cho Game Frontend (React + Vite build)
#
# HƯỚNG DẪN SỬ DỤNG:
#   1. Thay YOUR_DOMAIN bằng domain thật (ví dụ: game.yoursite.com)
#   2. Thay /var/www/game bằng đường dẫn build thực tế (nơi chứa dist/)
#   3. Nếu dùng SSL: điền đường dẫn cert và key, bỏ comment block HTTPS
#   4. Copy file này tới /etc/nginx/sites-available/game.conf
#      rồi chạy: sudo ln -s /etc/nginx/sites-available/game.conf /etc/nginx/sites-enabled/
#      và:       sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS (bỏ comment khi có SSL)
# server {
#     listen 80;
#     server_name YOUR_DOMAIN www.YOUR_DOMAIN;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;      # ← bật khi có SSL

    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    # server_name localhost;     # ← dùng cho local dev

    root /var/www/game/dist;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── SSL (bỏ comment khi đã có cert từ Let's Encrypt) ──────────────────────
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache   shared:SSL:10m;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection "1; mode=block"       always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API reverse proxy (backend) ───────────────────────────────────────────
    location /api/ {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_cache_bypass  $http_upgrade;
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
