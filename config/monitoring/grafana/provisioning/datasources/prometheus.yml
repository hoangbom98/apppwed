# Grafana auto-provisioned datasource — Prometheus
# This file is mounted at /etc/grafana/provisioning/datasources/
# Grafana reads it on startup and creates the datasource automatically.

apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      timeInterval: "15s"
