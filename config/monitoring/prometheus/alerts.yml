# Prometheus Alert Rules — LKVIP GROUP
#
# Copy to /etc/prometheus/alerts.yml
#
# Reload after change:
#   sudo systemctl reload prometheus
#   # or: curl -X POST http://localhost:9090/-/reload

groups:

  # ── LKVIP Backend Alerts ──────────────────────────────────────────────────────
  - name: lkvip_backend
    rules:

      # API server is completely unreachable (Prometheus cannot scrape /metrics)
      - alert: LKVIPServiceDown
        expr: up{job="lkvip-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LKVIP API server is DOWN"
          description: >
            Prometheus cannot reach the LKVIP backend at localhost:5000/metrics.
            The API server has been unreachable for more than 2 minutes.
            Check: pm2 status, pm2 logs lkvip-api

      # High error rate — more than 5 errors/minute sustained for 5 minutes
      - alert: LKVIPHighErrorRate
        expr: rate(lkvip_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LKVIP API error rate is high"
          description: >
            Error rate is {{ humanize $value }} errors/sec
            (> 0.1/sec = ~6/min) for the past 5 minutes.
            Check logs: pm2 logs lkvip-api --err

      # Memory usage is too high — RSS above 350MB per instance
      - alert: LKVIPHighMemoryUsage
        expr: lkvip_memory_rss_bytes > 367001600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LKVIP API memory usage is high"
          description: >
            RSS memory is {{ humanizeSI $value }}B (threshold: 350MB).
            Consider restarting: pm2 reload lkvip-api
            Or check for memory leaks in recent deployments.

      # Heap usage above 80% of heap total (potential OOM approaching)
      - alert: LKVIPHeapNearLimit
        expr: >
          lkvip_memory_heap_used_bytes / lkvip_memory_heap_total_bytes > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LKVIP API heap usage above 80%"
          description: >
            Heap used / total = {{ humanizePercentage $value }}.
            Node.js may GC more aggressively or OOM soon.

      # High request rate — more than 500 req/sec
      - alert: LKVIPHighRequestRate
        expr: rate(lkvip_requests_total[1m]) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LKVIP API is receiving unusually high traffic"
          description: >
            Request rate is {{ humanize $value }} req/sec (threshold: 500/sec).
            Possible DDoS or traffic spike — check Nginx rate limit logs.

  # ── VPS Host Alerts (Node Exporter) ─────────────────────────────────────────
  - name: vps_host
    rules:

      # Node Exporter is down — cannot collect OS metrics
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node Exporter is not reachable"
          description: >
            Cannot scrape OS metrics from Node Exporter at localhost:9100.
            Check: systemctl status prometheus-node-exporter

      # Disk space running low (< 15% free on root partition)
      - alert: DiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on VPS root partition"
          description: >
            Only {{ humanizePercentage $value }} disk space remaining on /.
            Clean up logs or backups: /var/LKVIP/data/logs/, pm2 flush

      # Critical disk space (< 5% — imminent failure)
      - alert: DiskSpaceCritical
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk space near full on VPS root partition"
          description: >
            Only {{ humanizePercentage $value }} disk space remaining on /.
            Immediate action required — server may stop functioning.

      # High CPU load (> 85% for 15 minutes)
      - alert: HighCPULoad
        expr: >
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on VPS"
          description: >
            CPU usage is above 85% for 15 minutes.
            Check: top, htop, or pm2 monit

      # High memory usage (> 90% of total RAM)
      - alert: HighMemoryUsage
        expr: >
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on VPS"
          description: >
            Memory usage is above 90% for 10 minutes.
            Available: {{ humanizeSI node_memory_MemAvailable_bytes }}B.
            Check: pm2 status, consider pm2 reload lkvip-api

  # ── Database Alerts (MySQL Exporter) ─────────────────────────────────────────
  - name: mysql
    rules:

      # MySQL is down
      - alert: MySQLDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL is DOWN"
          description: >
            MySQL exporter at localhost:9104 is not responding.
            Check: systemctl status mysql

      # Too many MySQL connections (> 80% of max_connections)
      - alert: MySQLHighConnections
        expr: >
          mysql_global_status_threads_connected /
          mysql_global_variables_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL connection count above 80% of max_connections"
          description: >
            {{ humanizePercentage $value }} of max_connections in use.
            Consider increasing max_connections or checking for connection leaks.
