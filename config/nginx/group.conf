# ═══════════════════════════════════════════════════════════════════════════════
#  Nginx Multi-Project Template — LKVIP GROUP
#
#  ⚠  File này là LEGACY TEMPLATE (placeholder "yourdomain.com").
#     Đây là phiên bản đơn giản hóa cho môi trường dev hoặc tham khảo.
#     PRODUCTION: dùng config/nginx/tc-gaming.conf (đã có đầy đủ auth rate limit,
#     proxy_buffering, security headers, sw.js caching, và uploads alias).
#
#  Domain map (thay "yourdomain.com" bằng domain thực):
#    yourdomain.com / www.yourdomain.com → Hub SPA
#    hub.yourdomain.com    → Hub portal
#    game.yourdomain.com   → Game portal
#    trade.yourdomain.com  → Trade portal
#    dating.yourdomain.com → Dating portal
#    sports.yourdomain.com → Sports portal
#    admin.yourdomain.com  → Admin portal (recommend IP whitelist)
#    api.yourdomain.com    → Backend API  (PM2 :5000)
#
#  SSL: certbot --nginx -d yourdomain.com -d www.yourdomain.com \
#                       -d hub.yourdomain.com -d game.yourdomain.com \
#                       -d trade.yourdomain.com -d dating.yourdomain.com \
#                       -d sports.yourdomain.com -d admin.yourdomain.com \
#                       -d api.yourdomain.com
# ═══════════════════════════════════════════════════════════════════════════════

# HTTP-level settings (gzip, ssl, rate-limit) đã định nghĩa trong:
#   /etc/nginx/conf.d/lkvip-http.conf  (copy từ config/nginx/lkvip-http.conf)

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream lkvip_api {
    server    127.0.0.1:5000;
    keepalive 64;
}

# ═══════════════════════════════════════════════════════════════════════════════
#  ROOT — yourdomain.com + www.yourdomain.com → Hub SPA
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://yourdomain.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.yourdomain.com;
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    return 301 https://yourdomain.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root  /var/LKVIP/apps/hub/dist;
    index index.html;

    location ~* ^/(sw\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /api/ {
        limit_req zone=lkvip_api burst=60 nodelay;
        proxy_pass http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s;
    }
    location /socket.io/ {
        proxy_pass http://lkvip_api; proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
        proxy_set_header Host $host; proxy_read_timeout 3600s;
    }
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always;
}

