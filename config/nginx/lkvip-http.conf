# ═══════════════════════════════════════════════════════════════════════════════
#  /etc/nginx/conf.d/lkvip-http.conf
#  HTTP-level additions for LKVIP GROUP @ tc-gaming.live
#
#  Chỉ thêm những gì NOT có trong /etc/nginx/nginx.conf mặc định của Ubuntu.
#  Kiểm tra trước: sudo nginx -T | grep "gzip\|ssl_protocol\|ssl_prefer" để
#  tránh duplicate directive gây lỗi "nginx -t".
#
#  Nội dung file này (đều là LKVIP-specific, không trùng default):
#    - Extended gzip_types
#    - gzip_vary / gzip_proxied / gzip_comp_level / gzip_min_length
#    - ssl_ciphers (modern — thay thế insecure HIGH:!aNULL:!MD5)
#    - ssl_session_cache  (tên SSL_LKVIP — không xung đột)
#    - ssl_session_timeout
#    - ssl_stapling + ssl_stapling_verify
#    - OCSP resolver
#    - Rate-limit zones (tên lkvip_api, lkvip_auth — không trùng project khác)
#    - map block cho image format negotiation (AVIF/WebP)
#
#  ⚠  ssl_protocols và ssl_prefer_server_ciphers đã có trong
#     /etc/nginx/nginx.conf — KHÔNG lặp lại ở đây (nginx -t sẽ lỗi).
#     Để enforce TLSv1.2+, sửa /etc/nginx/nginx.conf:
#       ssl_protocols TLSv1.2 TLSv1.3;
#       ssl_prefer_server_ciphers off;
#
#  Install:
#    sudo cp /var/LKVIP/config/nginx/lkvip-http.conf \
#            /etc/nginx/conf.d/lkvip-http.conf
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════════

# ── Gzip compression ───────────────────────────────────────────────────────────
# Ubuntu nginx.conf mặc định chỉ có "gzip on;" bare, không có types/variants.
gzip             on;
gzip_vary        on;
gzip_proxied     any;
gzip_comp_level  5;
gzip_min_length  1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/x-javascript
    application/xml application/xml+rss application/atom+xml
    image/svg+xml font/woff2;

# ── Open file cache ────────────────────────────────────────────────────────────
# Caches file descriptors + metadata cho static files (SPAs trong apps/*/dist).
# Giảm syscall overhead đáng kể khi Nginx serve 5 SPA dirs.
# max = max số lượng FD cache entries; inactive = đuổi sau 20s không dùng.
open_file_cache          max=2000 inactive=20s;
open_file_cache_valid    30s;   # revalidate sau 30s
open_file_cache_min_uses 2;     # cache sau ≥ 2 lần truy cập
open_file_cache_errors   on;    # cache cả ENOENT để tránh stat() lặp lại

# ── SSL: modern cipher suite ───────────────────────────────────────────────────
# Không duplicate ssl_protocols (đã set trong /etc/nginx/nginx.conf)
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# ── SSL session cache (named — không xung đột với config khác) ────────────────
ssl_session_cache   shared:SSL_LKVIP:10m;
ssl_session_timeout 1d;

# ── OCSP Stapling ──────────────────────────────────────────────────────────────
ssl_stapling        on;
ssl_stapling_verify on;
resolver            8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout    5s;

# ── Rate limiting zones (tên unique — không đụng project khác trên VPS) ───────
limit_req_zone  $binary_remote_addr zone=lkvip_api:20m    rate=120r/m;
limit_req_zone  $binary_remote_addr zone=lkvip_auth:10m   rate=10r/m;
limit_req_status 429;

# ── Image format negotiation (AVIF / WebP — Vary: Accept for CDN) ─────────────
map $http_accept $lkvip_img_type {
    default        "";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}
