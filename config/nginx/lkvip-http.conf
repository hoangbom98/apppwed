# ═══════════════════════════════════════════════════════════════════════════════
#  /etc/nginx/conf.d/lkvip-http.conf
#  HTTP-level additions for LKVIP GROUP @ tc-gaming.live
#
#  Only adds what the default Ubuntu nginx.conf does NOT already have:
#    - gzip on          → already in nginx.conf (skip)
#    - ssl_protocols    → already in nginx.conf (skip)
#    - ssl_prefer_...   → already in nginx.conf (skip)
#
#  What we ADD here (unique to LKVIP, not in default nginx.conf):
#    - Extended gzip_types  (default only has gzip on; with no types)
#    - gzip_vary / gzip_proxied / gzip_comp_level
#    - ssl_ciphers (modern — replaces insecure default)
#    - ssl_session_cache (named SSL_LKVIP — no conflict)
#    - ssl_session_timeout
#    - ssl_stapling
#    - OCSP resolver
#    - Rate-limit zones (lkvip_api, lkvip_auth — unique names)
#    - map for image format negotiation
#
#  Install:
#    sudo cp /var/LKVIP/config/nginx/lkvip-http.conf /etc/nginx/conf.d/lkvip-http.conf
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════════

# ── Extended gzip (nginx.conf only has bare "gzip on;") ───────────────────────
gzip_vary        on;
gzip_proxied     any;
gzip_comp_level  5;
gzip_min_length  1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/x-javascript
    application/xml application/xml+rss application/atom+xml
    image/svg+xml font/woff2;

# ── SSL ciphers (not in default nginx.conf — safe to add) ─────────────────────
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

# NOTE: ssl_protocols and ssl_prefer_server_ciphers are already in
# /etc/nginx/nginx.conf — do NOT repeat them here (nginx -t will error).
# To enforce TLSv1.2+, edit /etc/nginx/nginx.conf directly:
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;

# ── SSL session cache (named — no conflict with other configs) ────────────────
ssl_session_cache   shared:SSL_LKVIP:10m;
ssl_session_timeout 1d;

# ── Rate limiting zones (unique names — no collision with other projects) ─────
limit_req_zone $binary_remote_addr zone=lkvip_api:20m    rate=120r/m;
limit_req_zone $binary_remote_addr zone=lkvip_auth:10m   rate=10r/m;

# ── Image format negotiation ─────────────────────────────────────────────────
map $http_accept $lkvip_img_type {
    default        "";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}
