# ═══════════════════════════════════════════════════════════════════════════════
#  Nginx Production Configuration — LKVIP GROUP
#
#  ⚠  File này là TEMPLATE — dùng "yourdomain.com" làm placeholder.
#     Để deploy thực tế tại tc-gaming.live, dùng: config/nginx/tc-gaming.conf
#
#  Domain map (thay "yourdomain.com" bằng domain thực):
#    yourdomain.com / www.yourdomain.com → Hub SPA
#    hub.yourdomain.com    → Hub portal
#    game.yourdomain.com   → Game portal
#    trade.yourdomain.com  → Trade portal
#    dating.yourdomain.com → Dating portal
#    sports.yourdomain.com → Sports portal
#    admin.yourdomain.com  → Admin portal (recommend IP whitelist)
#    api.yourdomain.com    → Backend API  (PM2 :5000)
#
#  SSL: Let's Encrypt via certbot --nginx
#  Install:
#    ln -sf /var/LKVIP/config/nginx/nginx.conf \
#           /etc/nginx/sites-enabled/lkvip-platform
#    nginx -t && systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════════

# ── Global rate limiting ─────────────────────────────────────────────────────
# Zone names use lkvip_ prefix to avoid collision with other projects on the VPS
limit_req_zone $binary_remote_addr zone=lkvip_api:20m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=lkvip_auth:10m  rate=10r/m;

# ── Image format negotiation (AVIF / WebP) ────────────────────────────────────
map $http_accept $lkvip_img_type {
    default        "";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}

# ── Upstream backend ─────────────────────────────────────────────────────────
upstream lkvip_api {
    server    127.0.0.1:5000;
    keepalive 64;
}

# ═══════════════════════════════════════════════════════════════════════════════
#  ROOT  —  yourdomain.com + www.yourdomain.com → Hub SPA
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://yourdomain.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    return 301 https://yourdomain.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root  /var/LKVIP/apps/hub/dist;
    index index.html;

    location ~* ^/(sw\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /api/ {
        limit_req zone=lkvip_api burst=60 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }
    location /api/hub/auth/ {
        limit_req zone=lkvip_auth burst=5 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
    location /uploads/ {
        alias   /var/LKVIP/apps/backend/uploads/;
        expires 30d;
        add_header Cache-Control          "public";
        add_header Vary                   "Accept";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
}

