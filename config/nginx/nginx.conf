# ═══════════════════════════════════════════════════════════════════════════════
#  Nginx Production Configuration — LKVIP GROUP
#
#  Domain map (replace "yourdomain.com" with your real domain):
#    hub.yourdomain.com      → SPA static files (code/frontend/hub/dist)
#    game.yourdomain.com     → SPA static files (code/frontend/game/dist)
#    trade.yourdomain.com    → SPA static files (code/frontend/trade/dist)
#    dating.yourdomain.com   → SPA static files (code/frontend/dating/dist)
#    sports.yourdomain.com   → SPA static files (code/frontend/sports/dist)
#    admin.yourdomain.com    → SPA static files (code/frontend/admin-dashboard/dist)
#    api.yourdomain.com      → Proxy → Node.js :5000
#
#  SSL: Let's Encrypt via certbot --nginx (run ssl-setup.sh)
#  Install: ln -sf /var/www/lkvip/config/nginx/nginx.conf \
#                  /etc/nginx/sites-enabled/lkvip-platform
# ═══════════════════════════════════════════════════════════════════════════════

# ── Global rate limiting ─────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_zone:20m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;

# ── Image format negotiation (AVIF / WebP) ────────────────────────────────────
# Adds "Vary: Accept" so CDNs / browsers cache format variants separately.
# Applied to every /uploads/ location.
map $http_accept $img_type {
    default                   "";
    "~*image/avif"            "avif";
    "~*image/webp"            "webp";
}

# ── Upstream backend ─────────────────────────────────────────────────────────
# Single API upstream — PM2 cluster on port 5000 handles all workers internally
upstream lkvip_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── Recommended main nginx.conf additions (http {} context) ──────────────────
# Add these to /etc/nginx/nginx.conf inside the http {} block:
#
#   tcp_nopush          on;
#   tcp_nodelay         on;
#   keepalive_timeout   65;
#   worker_processes    auto;
#   worker_rlimit_nofile 65535;
#   events { worker_connections 4096; }
#
# ─────────────────────────────────────────────────────────────────────────────

# ── Gzip ─────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/x-javascript
    application/xml application/xml+rss application/atom+xml
    image/svg+xml font/woff2;

# ── SSL shared settings (included per server) ─────────────────────────────────
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_stapling        on;
ssl_stapling_verify on;

# ── Proxy headers macro ──────────────────────────────────────────────────────
# (repeated inline per location for clarity)

# ── Static-file cache strategy ───────────────────────────────────────────────
# Each SPA server block already contains two rules:
#
#   location /assets/ {
#       expires 1y;
#       add_header Cache-Control "public, immutable";
#       access_log off;
#   }
#
# Vite hashes every asset file name (e.g. main.abc123.js) so
# "immutable" is safe — the browser only re-downloads on hash change.
#
# index.html MUST NOT be cached (contains the entry-point hash references):
#   location / {
#       try_files $uri $uri/ /index.html;
#       add_header Cache-Control "no-cache";
#   }
#
# Uploaded user files are served for 30 days:
#   location /uploads/ { expires 30d; ... }
#
# For fonts and raw images outside /assets/ (e.g. CDN-proxied or public/):
#   location ~* \.(woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
#       expires 1y;
#       add_header Cache-Control "public, immutable";
#       access_log off;
#   }
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════════════
#  HUB  —  hub.yourdomain.com
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name hub.yourdomain.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hub.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/hub.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.yourdomain.com/privkey.pem;

    root  /var/www/lkvip/code/frontend/hub/dist;
    index index.html;

    # sw.js + manifest.json — must always be re-validated (never immutable)
    location ~* ^/(sw\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        access_log off;
    }
    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    # Hashed static assets — immutable 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # API proxy
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }
    # Auth rate limiting
    location /api/hub/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # Socket.IO
    location /socket.io/ {
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
    # Uploaded files — WebP/AVIF with Vary: Accept for CDN format-splitting
    location /uploads/ {
        alias   /var/www/lkvip/code/backend/uploads/;
        expires 30d;
        add_header Cache-Control          "public";
        add_header Vary                   "Accept";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
}

