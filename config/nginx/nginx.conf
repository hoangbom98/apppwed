    listen 443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;

    # ── SECURITY: Restrict admin to trusted IPs ──────────────────────────────────
    # STRONGLY recommended for production — uncomment and replace with your real IPs:
    # allow 1.2.3.4;       # office static IP
    # allow 5.6.7.8;       # VPN exit IP
    # allow 9.10.11.12;    # developer home IP
    # deny all;            # block all other IPs
    # ─────────────────────────────────────────────────────────────────────────────

    root  /var/www/lkvip/code/frontend/admin-dashboard/dist;
    index index.html;

    location ~* ^/(sw\.js|manifest\.json)$ { try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header Pragma "no-cache"; access_log off; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }
    location /api/admin/auth/ {
        limit_req zone=auth_zone burst=3 nodelay;
        proxy_pass http://lkvip_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        alias   /var/www/lkvip/code/backend/uploads/;
        expires 30d;
        add_header Cache-Control          "public";
        add_header Vary                   "Accept";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff    always;
}

