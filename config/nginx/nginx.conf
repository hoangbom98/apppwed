# ═══════════════════════════════════════════════════════════════════════════════
#  ADMIN  —  admin.yourdomain.com
#  ⚠️  Recommend IP whitelist in production
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://$host$request_uri;
}
