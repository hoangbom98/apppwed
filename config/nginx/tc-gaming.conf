# ═══════════════════════════════════════════════════════════════════════════════
#  Nginx Production Configuration — LKVIP GROUP @ tc-gaming.live
#  VPS IP  : 104.248.146.203
#  Deploy  : /var/LKVIP
#
#  Domain map:
#    tc-gaming.live / www.tc-gaming.live  → Hub SPA (canonical: tc-gaming.live)
#    hub.tc-gaming.live                   → Hub portal
#    api.tc-gaming.live                   → Backend API  (PM2 :5000)
#    trade.tc-gaming.live                 → Trade portal
#    sports.tc-gaming.live                → Sports portal
#    dating.tc-gaming.live                → Dating portal
#    game.tc-gaming.live                  → Game portal
#    admin.tc-gaming.live                 → Admin portal (⚠ IP whitelist recommended)
#    lkvip.tc-gaming.live                 → LKVIP Group Portal (Next.js :3010)
#
#  Note:
#    - HTTP-level settings (gzip, ssl_ciphers, rate-limit zones, map) đã tách
#      riêng sang: config/nginx/lkvip-http.conf → /etc/nginx/conf.d/lkvip-http.conf
#    - Tất cả SPAs được serve static files — không expose port Node.js dev.
#    - PM2 cluster :5000 là DUY NHẤT cổng service nội bộ.
#
#  Install:
#    ln -sf /var/LKVIP/config/nginx/tc-gaming.conf \
#           /etc/nginx/sites-enabled/tc-gaming
#    nginx -t && systemctl reload nginx
#
#  SSL (chạy sau install):
#    bash /var/LKVIP/scripts/ssl-setup.sh
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstream: PM2 backend cluster ─────────────────────────────────────────────
upstream lkvip_api {
    server    127.0.0.1:5000;
    keepalive 64;
}

# ═══════════════════════════════════════════════════════════════════════════════
#  ROOT  —  tc-gaming.live + www.tc-gaming.live → Hub SPA
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name tc-gaming.live www.tc-gaming.live;
    return 301 https://tc-gaming.live$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.tc-gaming.live;

    ssl_certificate     /etc/letsencrypt/live/tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-gaming.live/privkey.pem;

    return 301 https://tc-gaming.live$request_uri;
}
server {
    listen 443 ssl http2;
    server_name tc-gaming.live;

    ssl_certificate     /etc/letsencrypt/live/tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-gaming.live/privkey.pem;

    root  /var/LKVIP/apps/hub/dist;
    index index.html;

    location ~* ^/(sw\.js|manifest\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /api/ {
        limit_req zone=lkvip_api burst=60 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }
    location /api/hub/auth/ {
        limit_req zone=lkvip_auth burst=5 nodelay;
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass         http://lkvip_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
    location /uploads/ {
        alias   /var/LKVIP/apps/backend/uploads/;
        expires 30d;
        add_header Cache-Control          "public";
        add_header Vary                   "Accept";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
}

