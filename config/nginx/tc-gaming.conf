#  LKVIP GROUP PORTAL  —  lkvip.tc-gaming.live
#  Next.js 15 standalone server (PM2 :3010)
# ═══════════════════════════════════════════════════════════════════════════════
upstream lkvip_portal {
    server    127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    server_name lkvip.tc-gaming.live;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name lkvip.tc-gaming.live;

    ssl_certificate     /etc/letsencrypt/live/tc-gaming.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-gaming.live/privkey.pem;

    # ── Static assets — Next.js public/ và _next/static/ ────────────────────
    location /_next/static/ {
        proxy_pass         http://lkvip_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static media uploads ─────────────────────────────────────────────────
    location /_next/image {
        proxy_pass         http://lkvip_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── API routes (rate-limited) ────────────────────────────────────────────
    location /api/ {
        limit_req zone=lkvip_api burst=30 nodelay;
        proxy_pass         http://lkvip_portal;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Admin login (stricter rate limit) ────────────────────────────────────
    location /api/admin-login {
        limit_req zone=lkvip_auth burst=5 nodelay;
        proxy_pass         http://lkvip_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── All other Next.js pages ───────────────────────────────────────────────
    location / {
        proxy_pass         http://lkvip_portal;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
}
