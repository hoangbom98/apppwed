# =============================================================================
# lkvip-redis.conf — Redis 7 tuning cho VPS 4 vCPU / 8 GB RAM
# =============================================================================
# Install (append vào redis.conf hiện tại hoặc dùng include):
#   sudo cp /var/LKVIP/config/redis/lkvip-redis.conf /etc/redis/conf.d/lkvip.conf
#   # Thêm vào cuối /etc/redis/redis.conf:
#   include /etc/redis/conf.d/lkvip.conf
#   sudo systemctl restart redis-server
#
# Verify:
#   redis-cli -a <password> INFO memory | grep used_memory_human
#   redis-cli -a <password> CONFIG GET maxmemory
# =============================================================================

# ── Bind & Security ───────────────────────────────────────────────────────────
# Chỉ accept connections từ localhost (backend trên cùng VPS)
bind 127.0.0.1

# Password bắt buộc — thay CHANGE_ME bằng mật khẩu mạnh
# Sync với REDIS_URL=redis://:PASSWORD@127.0.0.1:6379 trong .env
requirepass CHANGE_ME_redis_password

# Tắt các commands nguy hiểm (rename thay vì disable để tránh lỗi nếu có code dùng)
rename-command FLUSHALL  ""
rename-command FLUSHDB   ""
rename-command CONFIG    ""
rename-command DEBUG     ""
rename-command SHUTDOWN  ""

# ── Memory limit ──────────────────────────────────────────────────────────────
# 1 GB = đủ cho session cache + BullMQ queues + price feed cache
# Tăng lên 1.5 GB nếu queue jobs lớn hoặc nhiều connections đồng thời
maxmemory 1gb

# Eviction policy khi đạt maxmemory:
# allkeys-lru = xóa key ít dùng nhất (tốt nhất cho cache + session mixed)
maxmemory-policy allkeys-lru

# ── Persistence (RDB snapshots) ───────────────────────────────────────────────
# Lưu snapshot định kỳ — đủ để recover sau restart VPS
# Format: save <seconds> <changes>
save 900 1       # lưu nếu có 1 thay đổi trong 15 phút
save 300 10      # lưu nếu có 10 thay đổi trong 5 phút
save 60  10000   # lưu nếu có 10000 thay đổi trong 1 phút

rdbcompression yes
rdbchecksum    yes
dbfilename     lkvip-dump.rdb
dir            /var/lib/redis

# ── AOF (Append-Only File) ────────────────────────────────────────────────────
# Tắt AOF để tiết kiệm disk I/O trên VPS nhỏ.
# Bật nếu cần durability cao (BullMQ jobs không được mất):
#   appendonly yes
#   appendfsync everysec
appendonly no

# ── Connection limits ─────────────────────────────────────────────────────────
# 2 PM2 instances × ~50 Redis connections mỗi = 100, cộng thêm buffer
maxclients 200

# Timeout idle connections sau 5 phút (giải phóng memory)
timeout 300

# TCP keepalive để detect broken connections
tcp-keepalive 60

# ── Performance ───────────────────────────────────────────────────────────────
# Tắt transparent huge pages (THP) warning — cũng cần set ở OS level
# (vps-setup.sh sẽ set: echo never > /sys/kernel/mm/transparent_hugepage/enabled)

# Lazy freeing — giải phóng memory async, không block main thread
lazyfree-lazy-eviction  yes
lazyfree-lazy-expire    yes
lazyfree-lazy-server-del yes

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/lkvip-redis.log

# ── Database count ────────────────────────────────────────────────────────────
# DB 0 = system, DB 1 = BoYue (existing), DB 2 = LKVIP (isolated)
# Backend .env: REDIS_URL=redis://:PASSWORD@127.0.0.1:6379/2
databases 4
