packages:
  - "packages/*"
  - "apps/backend"
  - "apps/hub"
  - "apps/game"
  - "apps/trading"
  - "apps/dating"
  - "apps/sports"
  - "apps/admin-dashboard"
  - "apps/mobile"

# ── Shared version catalog ────────────────────────────────────────────────────
# Khai báo phiên bản một lần, tất cả apps dùng "catalog:" thay vì hardcode.
# Khi cần upgrade: chỉ đổi đây, chạy pnpm install — xong.
catalog:
  # ── React ecosystem ──────────────────────────────────────────────────────────
  react:                          "^19.2.7"
  react-dom:                      "^19.2.7"
  react-router-dom:               "^7.18.1"
  react-hook-form:                "^7.54.0"
  react-hot-toast:                "^2.6.0"
  react-i18next:                  "^17.0.11"
  react-helmet-async:             "^3.0.0"
  react-intersection-observer:    "^9.5.3"
  framer-motion:                  "^11.15.0"
  # ── State & data fetching ─────────────────────────────────────────────────────
  "@tanstack/react-query":        "^5.101.2"
  "@tanstack/react-table":        "^8.21.3"
  zustand:                        "^5.0.14"
  # ── Network & realtime ────────────────────────────────────────────────────────
  axios:                          "^1.18.1"
  socket.io-client:               "^4.8.3"
  # ── UI components ──────────────────────────────────────────────────────────────
  antd:                           "^6.5.1"
  "@ant-design/icons":            "^6.3.2"
  lucide-react:                   "^0.525.0"
  recharts:                       "^3.9.2"
  classnames:                     "^2.5.1"
  # ── Forms & validation ────────────────────────────────────────────────────────
  "@hookform/resolvers":          "^3.9.0"
  yup:                            "^1.7.1"
  # ── i18n ─────────────────────────────────────────────────────────────────────
  i18next:                        "^26.3.6"
  # ── Capacitor (mobile) ────────────────────────────────────────────────────────
  "@capacitor/core":              "^7.0.0"
  "@capacitor/app":               "^7.0.0"
  "@capacitor/android":           "^7.0.0"
  "@capacitor/ios":               "^7.0.0"
  "@capacitor/haptics":           "^7.0.0"
  "@capacitor/keyboard":          "^7.0.0"
  "@capacitor/network":           "^7.0.0"
  "@capacitor/push-notifications": "^7.0.0"
  "@capacitor/splash-screen":     "^7.0.0"
  "@capacitor/status-bar":        "^7.0.0"
  # ── Build tooling (devDeps) ────────────────────────────────────────────────────
  typescript:                     "~6.0.2"
  vite:                           "^8.1.1"
  "@vitejs/plugin-react":         "^6.0.3"
  tailwindcss:                    "^4.3.3"
  autoprefixer:                   "^10.5.4"
  postcss:                        "^8.5.20"
  oxlint:                         "^1.71.0"
  cross-env:                      "^7.0.3"
  "@types/node":                  "^24.13.2"
  "@types/react":                 "^19.2.17"
  "@types/react-dom":             "^19.2.3"
  "@capacitor/cli":               "^7.0.0"
  # NOTE: workspace:* packages KHÔNG được khai báo trong catalog (pnpm restriction).
  # Mỗi app khai báo trực tiếp: "@lkvip/ui": "workspace:*" trong package.json

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
