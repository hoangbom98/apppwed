<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="48" height="48" rx="10" fill="#e11d48"/>
  <!-- Camera/live icon -->
  <rect x="10" y="17" width="24" height="16" rx="4" fill="white"/>
  <circle cx="22" cy="25" r="5" fill="#e11d48"/>
  <circle cx="22" cy="25" r="2.5" fill="#e11d48" opacity="0.4"/>
  <!-- Camera lens -->
  <circle cx="22" cy="25" r="3" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Viewfinder triangle -->
  <polygon points="36,18 36,32 44,25" fill="white"/>
  <!-- LIVE badge -->
  <rect x="10" y="34" width="18" height="8" rx="2" fill="#dc2626"/>
  <text x="19" y="40" text-anchor="middle" fill="white" font-size="6" font-weight="bold" font-family="Arial">LIVE</text>
  <!-- Red recording dot -->
  <circle cx="31" cy="38" r="3" fill="#dc2626"/>
  <circle cx="31" cy="38" r="3" fill="#ef4444" opacity="0.6"/>
</svg>
