<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="48" height="48" rx="10" fill="#dc2626"/>
  <!-- Four cards fan -->
  <rect x="8" y="20" width="12" height="16" rx="2" fill="white" transform="rotate(-20 14 28)"/>
  <rect x="12" y="16" width="12" height="16" rx="2" fill="#fde68a" transform="rotate(-8 18 24)"/>
  <rect x="18" y="15" width="12" height="16" rx="2" fill="white" transform="rotate(5 24 23)"/>
  <rect x="24" y="17" width="12" height="16" rx="2" fill="#fde68a" transform="rotate(18 30 25)"/>
  <!-- Card symbol -->
  <text x="24" y="30" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">♦</text>
</svg>
