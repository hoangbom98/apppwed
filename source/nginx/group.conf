# ── Multi-Project Nginx Configuration ──────────────────────────────────────
# Domain structure:
#   hub.yourdomain.com     → Hub portal     (port 5173 or /hub dist)
#   game.yourdomain.com    → Game portal    (port 5174 or /game dist)
#   dating.yourdomain.com  → Dating portal  (port 5176 or /dating dist)
#   trade.yourdomain.com   → Trade portal   (port 5177 or /trade dist)
#   sports.yourdomain.com  → Sports portal  (port 5178 or /sports dist)
#   admin.yourdomain.com   → Admin portal   (port 5175 or /admin dist)
#   api.yourdomain.com     → Backend API    (port 5000)
#
# Replace yourdomain.com with your actual domain.
# SSL certificates managed by Certbot / Let's Encrypt.

# ── Rate limiting zones ─────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── Upstream: backend API ───────────────────────────────────────────────────
upstream backend_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ── Gzip ────────────────────────────────────────────────────────────────────
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

# ── Hub Portal ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name hub.yourdomain.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hub.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/hub.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/website-admin/source/frontend/hub/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /uploads/ {
        alias /var/www/website-admin/source/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Game Portal ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name game.yourdomain.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name game.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/game.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/website-admin/source/frontend/game/dist;
    index index.html;

    location / { try_files $uri $uri/ /index.html; expires 1h; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    location /uploads/ {
        alias /var/www/website-admin/source/backend/uploads/;
        expires 30d;
    }
}

